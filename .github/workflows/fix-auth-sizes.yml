name: Fix BalticM auth sizes

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: self-hosted
    steps:
      - name: Fix auth sizes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $app = 'C:\BalticM\balticm-home'
          $base = Join-Path $app 'azuriom-theme\balticm\views\layouts\base.blade.php'
          $text = [IO.File]::ReadAllText($base)
          $old = '.bm-login-dialog{position:relative;width:min(1080px,96vw);min-height:650px;display:grid;grid-template-columns:43% 57%;overflow:hidden;'
          $new = '.bm-login-dialog{position:relative;width:min(1080px,96vw);height:650px;min-height:650px;max-height:calc(100vh - 44px);display:grid;grid-template-columns:43% 57%;overflow:hidden;'
          if (-not $text.Contains($old)) { throw 'Auth dialog CSS pattern not found.' }
          $text = $text.Replace($old,$new)
          $old2 = '.bm-login-formside{display:flex;flex-direction:column;justify-content:center;padding:55px 58px 42px;background:'
          $new2 = '.bm-login-formside{display:flex;flex-direction:column;justify-content:center;min-height:0;height:100%;padding:55px 58px 42px;background:'
          if (-not $text.Contains($old2)) { throw 'Auth formside CSS pattern not found.' }
          $text = $text.Replace($old2,$new2)
          $marker = '        .bm-login-view{width:100%}'
          $insert = '        .bm-login-view{width:100%;min-height:0;display:flex;flex-direction:column;justify-content:center}'
          if (-not $text.Contains($marker)) { throw 'Auth view CSS marker not found.' }
          $text = $text.Replace($marker,$insert)
          $text = $text.Replace('@media(max-width:820px){.bm-login-dialog{grid-template-columns:1fr;min-height:0;max-height:92vh;overflow:auto}', '@media(max-width:820px){.bm-login-dialog{grid-template-columns:1fr;height:auto;min-height:0;max-height:92vh;overflow:auto}')
          [IO.File]::WriteAllText($base,$text,[Text.UTF8Encoding]::new($false))
          git -C $app config user.name 'BalticM Deploy'
          git -C $app config user.email 'deploy@balticm.eu'
          git -C $app add azuriom-theme/balticm/views/layouts/base.blade.php .github/workflows/fix-auth-sizes.yml
          git -C $app rm .github/workflows/fix-auth-sizes.yml
          git -C $app commit -m 'Normalize auth popup dimensions'
          git -C $app push origin main
