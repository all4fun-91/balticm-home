name: Deploy BalticM to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Update VPS working copy
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $app = 'C:\BalticM\balticm-home'
          git -C $app fetch origin main
          git -C $app reset --hard origin/main

      - name: Deploy BalticM Azuriom theme
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $app = 'C:\BalticM\balticm-home'
          $themeSource = Join-Path $app 'azuriom-theme\balticm'
          $themeTarget = 'C:\Azuriom\resources\themes\balticm'
          $php = 'C:\tools\php83\php.exe'

          if (-not (Test-Path 'C:\Azuriom\artisan')) {
            throw 'Azuriom installation not found at C:\Azuriom.'
          }

          if (-not (Test-Path $php)) {
            throw 'PHP executable not found at C:\tools\php83\php.exe.'
          }

          if (Test-Path $themeTarget) {
            Remove-Item $themeTarget -Recurse -Force
          }

          New-Item -ItemType Directory -Path $themeTarget -Force | Out-Null
          Copy-Item "$themeSource\*" $themeTarget -Recurse -Force

          Push-Location 'C:\Azuriom'
          $tinkerCode = "app(\Azuriom\Extensions\Theme\ThemeManager::class)->changeTheme('balticm'); app(\Azuriom\Support\Optimizer::class)->clearViewCache();"
          & $php artisan tinker --execute=$tinkerCode
          if ($LASTEXITCODE -ne 0) { throw 'Azuriom theme activation failed.' }
          & $php artisan optimize:clear
          if ($LASTEXITCODE -ne 0) { throw 'Azuriom cache clear failed.' }
          Pop-Location

      - name: Deploy and restart Caddy
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $app = 'C:\BalticM\balticm-home'
          $caddy = 'C:\Users\Administrator\balticm-home\services\caddy\caddy.exe'
          $configSource = Join-Path $app 'services\caddy\Caddyfile'
          $configTarget = 'C:\Users\Administrator\balticm-home\services\caddy\Caddyfile'

          if (-not (Test-Path $caddy)) {
            throw 'Caddy executable not found.'
          }
          if (-not (Test-Path $configSource)) {
            throw 'Caddyfile not found in the GitHub working copy.'
          }

          Copy-Item $configSource $configTarget -Force
          & $caddy validate --config $configTarget --adapter caddyfile
          if ($LASTEXITCODE -ne 0) { throw 'Caddy configuration validation failed.' }

          Get-CimInstance Win32_Process -Filter "Name='caddy.exe'" | ForEach-Object {
            Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue
          }
          Start-Sleep -Seconds 2

          Start-Process -FilePath $caddy -ArgumentList 'run','--config',$configTarget,'--adapter','caddyfile' -WorkingDirectory (Split-Path $caddy) -WindowStyle Hidden
          Start-Sleep -Seconds 8

          $listening80 = Get-NetTCPConnection -LocalPort 80 -State Listen -ErrorAction SilentlyContinue
          if (-not $listening80) { throw 'Caddy is not listening on port 80 after restart.' }

          $listening443 = Get-NetTCPConnection -LocalPort 443 -State Listen -ErrorAction SilentlyContinue
          if (-not $listening443) { throw 'Caddy is not listening on port 443 after restart.' }

          $http = & curl.exe -sS -o NUL -w '%{http_code}' http://127.0.0.1/ -H 'Host: balticm.eu'
          if ($LASTEXITCODE -ne 0) { throw 'HTTP localhost health check failed.' }
          if ($http -ne '308') { throw "Expected HTTP 308 redirect, got HTTP $http." }

          $httpsCode = & curl.exe -k -sS -o NUL -w '%{http_code}' -L --resolve 'balticm.eu:443:127.0.0.1' https://balticm.eu/
          if ($LASTEXITCODE -ne 0) { throw 'HTTPS localhost health check failed.' }
          if ($httpsCode -ne '200') { throw "Expected HTTPS 200, got HTTP $httpsCode." }

      - name: Restart BalticM Node server
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $app = 'C:\BalticM\balticm-home'
          $processIds = Get-NetTCPConnection -LocalPort 3000 -State Listen -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty OwningProcess -Unique
          foreach ($processId in $processIds) {
            Stop-Process -Id $processId -Force -ErrorAction SilentlyContinue
          }
          Start-Sleep -Seconds 2
          Start-Process -FilePath 'node.exe' -ArgumentList 'server.mjs' -WorkingDirectory $app -WindowStyle Hidden
          Start-Sleep -Seconds 3
          $listening = Get-NetTCPConnection -LocalPort 3000 -State Listen -ErrorAction SilentlyContinue
          if (-not $listening) { throw 'BalticM is not listening on port 3000 after restart.' }
