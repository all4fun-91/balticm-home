name: Fix BalticM homepage nav left

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: self-hosted
    steps:
      - name: Move homepage navigation left
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $app = 'C:\BalticM\balticm-home'
          $file = Join-Path $app 'azuriom-theme\balticm\views\home.blade.php'
          $text = [IO.File]::ReadAllText($file)
          $patterns = @(
            '.bm-links{display:flex;gap:28px;margin-left:auto;margin-right:38px}',
            '.bm-links{display:flex;gap:28px;position:absolute;left:50%;transform:translateX(-50%);margin:0;white-space:nowrap;z-index:2}'
          )
          $new = '.bm-links{display:flex;gap:28px;margin-left:55px;margin-right:auto}'
          $changed = $false
          foreach ($old in $patterns) {
            if ($text.Contains($old)) {
              $text = $text.Replace($old, $new)
              $changed = $true
              break
            }
          }
          if (-not $changed) { throw 'Homepage nav CSS pattern not found.' }
          [IO.File]::WriteAllText($file, $text, [Text.UTF8Encoding]::new($false))
          git -C $app config user.name 'BalticM Deploy'
          git -C $app config user.email 'deploy@balticm.eu'
          git -C $app add azuriom-theme/balticm/views/home.blade.php .github/workflows/fix-home-nav-left.yml
          git -C $app rm .github/workflows/fix-home-nav-left.yml
          git -C $app commit -m 'Move homepage navigation to left'
          git -C $app push origin main
